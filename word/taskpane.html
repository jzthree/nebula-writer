<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Writer for Word</title>
    <!-- Office.js must load before the app module; it is the only external
         script. In mock mode (?mock=1, a plain browser with an in-memory Word)
         it is skipped: outside a host, Office.js keeps re-initializing the
         global `Office` object and would clobber the mock. -->
    <script>
      if (!/[?&]mock=1(?:&|$)/.test(window.location.search)) {
        document.write('<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"><\/script>');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/word/main.tsx"></script>
  </body>
</html>
