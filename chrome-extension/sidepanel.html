<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nebula Writer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2933; }
      body { display: flex; flex-direction: column; }
      iframe { border: 0; width: 100%; flex: 1; min-height: 0; display: block; }
      #notice { display: none; padding: 16px; flex-shrink: 0; }
      #notice.show { display: block; }
      #notice code { background: #f1f3f5; padding: 1px 4px; border-radius: 3px; }
      #comments { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #dadce0; flex-shrink: 0; }
      #comments-status { min-width: 0; overflow-wrap: anywhere; color: #5f6368; font-size: 12px; }
      #comments-connect { font: inherit; font-size: 12px; white-space: nowrap; border: 1px solid #dadce0; border-radius: 4px; background: #fff; color: #202124; padding: 4px 8px; cursor: pointer; }
      #comments-connect:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="notice" role="status"></div>
    <div id="comments"><span id="comments-status" role="status">Comments not connected</span><button id="comments-connect" type="button" disabled>Connect comments</button></div>
    <iframe id="pane" allow="clipboard-write"></iframe>
    <script src="dist/sidepanel.js"></script>
  </body>
</html>
