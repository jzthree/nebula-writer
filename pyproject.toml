[project]
name = "style-turing"
version = "0.1.0"
description = "Style Turing test: develop journal writing-style skills until judges cannot tell them from published text"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stl = "styleturing.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["styleturing"]
